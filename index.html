<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoeken</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="home">
    <header class="home-top">
      <div class="home-top__right">
        <a href="#" class="toplink">Gmail</a>
        <a href="#" class="toplink">Afbeeldingen</a>
        <a href="#" class="signin">Inloggen</a>
      </div>
    </header>

    <main class="home-main">
      <img class="home-logo" src="logo.gif" alt="Logo" />

      <form id="homeForm" class="home-search" autocomplete="off">
        <input id="homeQuery" class="home-input" type="text" name="q" />
      </form>

      <div class="home-buttons">
        <button type="submit" form="homeForm">Google Zoeken</button>
        <button type="button">Ik doe een gok</button>
      </div>

      <div class="home-lang">Google aangeboden in: <a href="#">Frysk</a></div>
    </main>

    <footer class="home-footer">
      <div class="footer-left">
        <a href="#">Nederland</a>
      </div>
      <div class="footer-row">
        <div>
          <a href="#">Adverteren</a>
          <a href="#">Bedrijf</a>
          <a href="#">Hoe Google Zoeken werkt</a>
        </div>
        <div>
          <a href="#">Privacy</a>
          <a href="#">Voorwaarden</a>
          <a href="#">Instellingen</a>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
